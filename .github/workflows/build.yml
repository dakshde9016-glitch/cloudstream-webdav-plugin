name: Build and Deploy Cloudstream Plugin

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating wrapper..."
            gradle wrapper --gradle-version 8.5
          fi
          chmod +x ./gradlew

      - name: Compile Cloudstream Plugins
        run: ./gradlew make

      - name: Generate Repository Plugins JSON Manifest
        run: ./gradlew makePluginsJson

      - name: Collect Build Artifacts
        run: |
          mkdir -p build
          # Copy all generated .cs3 files into root build folder for deployment
          find . -name "*.cs3" -exec cp -v {} build/ \;
          if [ -f "repo.json" ]; then
            cp -v repo.json build/
          fi
          echo "=== Content of build folder to deploy ==="
          ls -la build/

      - name: Deploy to Orphan Builds Branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: builds
          folder: build
          clean: true
          commit-message: "Publish plugin build: ${{ github.sha }}"
